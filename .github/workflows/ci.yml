name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure runtime directories exist
        run: mkdir -p models/credit_risk models/fraud logs/audit_trail data/processed data/document_cache

      # Module 5: build the chatbot's TF-IDF knowledge-base index BEFORE the tests.
      - name: Build knowledge-base index
        run: python scripts/ingest_knowledge_base.py

      - name: Run unit tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  api-smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure runtime directories exist
        run: mkdir -p logs/audit_trail data/document_cache

      - name: Build knowledge-base index
        run: python scripts/ingest_knowledge_base.py

      - name: Train both models (so the API has something to load)
        run: python scripts/train_model.py --engine both

      - name: Smoke-test the API with TestClient
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from serving.api import app
          client = TestClient(app)

          r = client.get('/health')
          assert r.status_code == 200, r.text
          assert r.json()['credit_model_loaded'] is True
          assert r.json()['fraud_model_loaded'] is True
          print('health ok:', r.json())

          # Module 5: full path underwrite -> explain -> letter -> chat (no GEMINI_API_KEY in CI,
          # so this exercises the offline template/rules fallbacks)
          r = client.post('/underwrite', json={'full_name': 'CI Tester', 'age': 35, 'monthly_income': 60000,
                                               'loan_amount_requested': 300000, 'tenure_months': 24})
          assert r.status_code == 200, r.text
          app_id = r.json()['application_id']

          r = client.post('/explain', json={'application_id': app_id, 'language': 'en'})
          assert r.status_code == 200 and r.json()['text'], r.text

          r = client.get(f'/application/{app_id}/letter?language=en')
          assert r.status_code == 200 and r.content.startswith(b'%PDF'), r.status_code

          r = client.post('/chat', json={'session_id': 'ci', 'message': 'EMI for 5 lakh for 36 months at 12%'})
          assert r.status_code == 200 and '16,607.15' in r.json()['reply'], r.text
          print('API smoke test passed')
          "
